name: CLI Minimum Version Warning

on:
  pull_request_target:
    branches: [main, v3-beta]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  comment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: Packages/src/Cli~/.go-version
          cache: false

      - name: Fetch pull request head
        run: git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head:cli-minimum-version-pr-head"

      - name: Comment on CLI minimum version check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLI_MINIMUM_VERSION_BASE_REF: origin/${{ github.base_ref }}
          CLI_MINIMUM_VERSION_HEAD_REF: cli-minimum-version-pr-head
        run: scripts/comment-cli-minimum-version-warning.sh
