name: Dead Code

on:
  pull_request:
    paths:
      - 'Packages/src/**/*.cs'
      - 'tools/UnityCliLoop.DeadCodeScanner/**'
      - 'tests/UnityCliLoop.DeadCodeScanner.Tests/**'
      - 'scripts/check-dead-code.sh'
      - '.github/workflows/dead-code.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dead-code:
    name: Dead Code Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Test dead code scanner
        run: dotnet test tests/UnityCliLoop.DeadCodeScanner.Tests/UnityCliLoop.DeadCodeScanner.Tests.csproj --configuration Release

      - name: Scan for dead code
        run: >
          scripts/check-dead-code.sh
          --root .
          --scope public
          --include-types true
          --include-members true
          --include-locals true
          --include-test-only true
          --include-kept false
          --format table
          --fail-on high-confidence
          # 24: CaptureMode.GameView is a JSON/schema alias for rendering (Enum.TryParse);
          # Roslyn sees no C# references by design.
          --max-public-candidates 24
