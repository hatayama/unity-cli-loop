name: Release Approval Pending Notify

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - native-cli-publish
      - dispatcher-publish
    types:
      - completed

permissions:
  actions: read
  issues: write
  contents: read

concurrency:
  group: release-approval-pending-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      # schedule/workflow_run can fire with a non-branch or stale ref, so this checkout pins
      # the branch that carries the release automation (cli/) explicitly: main, where the V3
      # tree lives after the stable merge.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: cli/.go-version
          cache: false

      - name: Reconcile pending release approval issue
        working-directory: cli/release-automation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: go run ./cmd/notify-pending-release-approvals
