name: release-please

on:
  push:
    branches:
      - main
      - v3-beta
  # Enable manual execution via "Run workflow" button in browser
  workflow_dispatch:
    inputs:
      branch:
        description: "Target branch name (uses current ref if not specified)"
        required: false

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          fetch-depth: 0 # Required for tag fetching

      - name: 🎯 Resolve target branch
        id: target
        env:
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          TARGET_BRANCH="${INPUT_BRANCH:-${GITHUB_REF_NAME}}"
          case "${TARGET_BRANCH}" in
            main|v3-beta)
              ;;
            *)
              echo "This release workflow only supports main and v3-beta." >&2
              exit 1
              ;;
          esac

          TARGET_SHA="$(git rev-parse HEAD)"
          echo "branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"

      - name: 🧭 Detect release commit
        id: release_commit
        run: |
          COMMIT_SUBJECT="$(git log -1 --format=%s)"
          if scripts/is-release-please-release-commit.sh "${COMMIT_SUBJECT}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release commit detected; release-please will wait for the next non-release commit."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Debug: Show repository structure ─────────────────────────
      - name: 🕵️ Show file tree
        run: |
          echo "PWD: $(pwd)"
          echo "===== ls -R ====="
          ls -R

      # ── Sanity check for package.json files ─────────
      - name: 🧪 Sanity check
        run: |
          test -f Packages/src/package.json && echo "✅ Unity package.json OK"

      - name: Setup Go for package release sync
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: cli/.go-version
          cache-dependency-path: cli/**/go.sum

      - name: 🏷️ Sync release-please package releases
        id: package_release_sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/sync-release-please-package-releases.sh

      - name: 🏷️ Sync published release PR labels
        if: steps.release_commit.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/sync-published-release-pr-labels.sh

      # ── Execute release-please ───────────────────────────
      - name: 🚀 Run release‑please
        if: steps.release_commit.outputs.skip != 'true' && steps.package_release_sync.outputs.ready != 'false'
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ steps.target.outputs.branch }}
          skip-github-release: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go for release PR automation
        if: steps.target.outputs.branch == 'v3-beta' && steps.release_commit.outputs.skip != 'true' && steps.package_release_sync.outputs.ready != 'false'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: cli/.go-version
          cache-dependency-path: cli/**/go.sum

      - name: Dispatch release PR checks
        if: steps.target.outputs.branch == 'v3-beta' && steps.release_commit.outputs.skip != 'true' && steps.package_release_sync.outputs.ready != 'false'
        working-directory: cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: go run ./cmd/dispatch-release-please-pr-checks
