name: Unity EditMode Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  checks: write
  contents: read

jobs:
  concurrency-unit-tests:
    name: Concurrency Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: 10.0.x

      - name: Run concurrency unit tests
        run: |
          dotnet test tests/DynamicCodeExecutionScheduler.UnitTests/DynamicCodeExecutionScheduler.UnitTests.csproj --configuration Release
          dotnet test tests/SharedRoslynCompilerWorker.UnitTests/SharedRoslynCompilerWorker.UnitTests.csproj --configuration Release
          dotnet test tests/OutputFileRetention.UnitTests/OutputFileRetention.UnitTests.csproj --configuration Release

  editmode-tests:
    name: EditMode Tests (${{ matrix.unity-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The committed project version: full EditMode suite plus the strict
          # zero-warning compile gate.
          - unity-version: 2022.3.62f3
            test-filter: ''
            strict-compile-check: true
          # Newer editors open the committed 2022.3 project through an ephemeral
          # in-place upgrade, so obsolete-API warnings are expected there; skip the
          # zero-warning gate and run only the hot-reload suites, which are the
          # cross-version compatibility signal these legs exist for. Compile errors
          # still fail the leg because the test runner cannot run without compiling.
          # The filter is an unanchored prefix on purpose: it matches both the
          # ...Tests.Editor.HotReload namespace and the ...HotReloadSpike namespace,
          # whose publicizer/worker-bootstrap spikes exercise exactly the machinery
          # that breaks across editor generations.
          - unity-version: 6000.3.15f1
            test-filter: io.github.hatayama.UnityCliLoop.Tests.Editor.HotReload
            strict-compile-check: false
          - unity-version: 6000.5.8f1
            test-filter: io.github.hatayama.UnityCliLoop.Tests.Editor.HotReload
            strict-compile-check: false
    env:
      HAS_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          lfs: true

      - name: Cache Library folder
        if: env.HAS_UNITY_LICENSE == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: Library
          key: Library-${{ matrix.unity-version }}-${{ hashFiles('Packages/src/**/*.cs', 'Assets/**/*.cs', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ matrix.unity-version }}-

      - name: Compile Unity project
        if: env.HAS_UNITY_LICENSE == 'true' && matrix.strict-compile-check == true
        id: compile
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2
        timeout-minutes: 30
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ matrix.unity-version }}
          targetPlatform: StandaloneLinux64
          buildMethod: ''
          allowDirtyBuild: true
        continue-on-error: true

      - name: Check for compile errors and warnings
        if: env.HAS_UNITY_LICENSE == 'true' && matrix.strict-compile-check == true
        run: |
          LOG_FILE=$(find . -name "*.log" -path "*/build/*" -o -name "Editor.log" 2>/dev/null | head -1)

          if [ -z "$LOG_FILE" ]; then
            echo "No Unity log file found, checking artifacts..."
            LOG_FILE="artifacts/unity-build.log"
          fi

          echo "=== Checking Unity compilation output ==="

          ERROR_COUNT=0
          WARNING_COUNT=0

          if [ -f "$LOG_FILE" ]; then
            echo "Analyzing log file: $LOG_FILE"

            ERROR_COUNT=$(grep -c "error CS[0-9]*:" "$LOG_FILE" 2>/dev/null || echo "0")
            WARNING_COUNT=$(grep -c "warning CS[0-9]*:" "$LOG_FILE" 2>/dev/null || echo "0")

            echo ""
            echo "=== Compilation Results ==="
            echo "Errors: $ERROR_COUNT"
            echo "Warnings: $WARNING_COUNT"
            echo ""

            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "::error::Found $ERROR_COUNT compile error(s)"
              echo ""
              echo "=== Errors ==="
              grep "error CS[0-9]*:" "$LOG_FILE" | head -20
              exit 1
            fi

            if [ "$WARNING_COUNT" -gt 0 ]; then
              echo "::warning::Found $WARNING_COUNT compile warning(s)"
              echo ""
              echo "=== Warnings ==="
              grep "warning CS[0-9]*:" "$LOG_FILE" | head -20
              exit 1
            fi

            echo "✅ No compile errors or warnings found!"
          else
            echo "::warning::Could not find Unity log file for analysis"
            if [ "${{ steps.compile.outcome }}" == "failure" ]; then
              echo "::error::Unity compilation failed"
              exit 1
            fi
          fi

      - name: Remove GameCI build script injected during compile
        if: env.HAS_UNITY_LICENSE == 'true' && matrix.strict-compile-check == true
        run: |
          # unity-builder copies its default build script (UnityBuilderAction) into the
          # workspace; left in place, the asmdef audit test sees a foreign auto-referenced
          # assembly and fails. sudo because the files are created root-owned inside the
          # GameCI container.
          sudo rm -rf "Assets/Editor/Editor"
          sudo rm -f "Assets/Editor/Editor.meta"
          # Fail loudly if the injection moved somewhere this cleanup does not cover,
          # so the leg points at the real cause instead of a confusing asmdef audit
          # failure later in the test step.
          LEFTOVER=$(find Assets -name 'UnityBuilderAction*' -print -quit)
          if [ -n "$LEFTOVER" ]; then
            echo "::error::GameCI build script found outside the expected injection path: $LEFTOVER"
            exit 1
          fi

      - name: Run EditMode tests
        if: env.HAS_UNITY_LICENSE == 'true'
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        # 45 minutes: the 6000.x legs upgrade the project in place on a cold Library
        # cache, which makes the first import much slower than a plain 2022.3 open.
        timeout-minutes: 45
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ matrix.unity-version }}
          testMode: EditMode
          customParameters: ${{ matrix.test-filter != '' && format('-testFilter {0}', matrix.test-filter) || '' }}
          checkName: Unity Test Results (${{ matrix.unity-version }})
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && env.HAS_UNITY_LICENSE == 'true'
        with:
          name: Unity test results (${{ matrix.unity-version }})
          path: artifacts

  resolve-latest-6000-7:
    name: Resolve latest 6000.7 editor
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      changeset: ${{ steps.resolve.outputs.changeset }}
      editorUrl: ${{ steps.resolve.outputs.editorUrl }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: cli/.go-version

      - name: Resolve newest 6000.7-series Linux editor
        id: resolve
        working-directory: cli/release-automation
        run: go run ./cmd/resolve-unity-release --series 6000.7 >> "$GITHUB_OUTPUT"

  editmode-tests-latest-alpha:
    name: EditMode Tests (latest 6000.7)
    runs-on: ubuntu-latest
    needs: resolve-latest-6000-7
    timeout-minutes: 90
    env:
      HAS_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
      UNITY_VERSION: ${{ needs.resolve-latest-6000-7.outputs.version }}
      UNITY_CHANGESET: ${{ needs.resolve-latest-6000-7.outputs.changeset }}
      UNITY_EDITOR_URL: ${{ needs.resolve-latest-6000-7.outputs.editorUrl }}
      UNITY_TARBALL: .unity-ci/unity-linux-editor.tar.xz
      UNITY_INSTALL_DIR: .unity-ci/unity-editor
      HOT_RELOAD_TEST_FILTER: io.github.hatayama.UnityCliLoop.Tests.Editor.HotReload
    steps:
      - name: Checkout repository
        if: env.HAS_UNITY_LICENSE == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          lfs: true

      - name: Free disk space
        if: env.HAS_UNITY_LICENSE == 'true'
        run: |
          set -eu
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Cache Linux editor tarball
        if: env.HAS_UNITY_LICENSE == 'true'
        id: editor-tarball-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ env.UNITY_TARBALL }}
          key: unity-linux-editor-${{ env.UNITY_VERSION }}-${{ env.UNITY_CHANGESET }}

      - name: Download Linux editor
        if: env.HAS_UNITY_LICENSE == 'true' && steps.editor-tarball-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p .unity-ci
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "$UNITY_TARBALL" \
            "$UNITY_EDITOR_URL"
          ls -lh "$UNITY_TARBALL"

      - name: Install Linux editor
        if: env.HAS_UNITY_LICENSE == 'true'
        id: install-editor
        run: |
          set -eu
          mkdir -p "$UNITY_INSTALL_DIR"
          tar -xJf "$UNITY_TARBALL" -C "$UNITY_INSTALL_DIR"
          UNITY_EDITOR=$(find "$UNITY_INSTALL_DIR" -path '*/Editor/Unity' -type f -print -quit)
          test -n "$UNITY_EDITOR"
          test -x "$UNITY_EDITOR"
          echo "UNITY_EDITOR=$UNITY_EDITOR" >> "$GITHUB_ENV"
          echo "editor=$UNITY_EDITOR" >> "$GITHUB_OUTPUT"
          echo "Installed Unity $UNITY_VERSION at $UNITY_EDITOR"
          df -h

      - name: Cache Library folder
        if: env.HAS_UNITY_LICENSE == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-debug-${{ hashFiles('Packages/src/**/*.cs', 'Assets/**/*.cs', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-debug-

      - name: Activate Unity license and run EditMode tests
        if: env.HAS_UNITY_LICENSE == 'true'
        timeout-minutes: 60
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -eu
          mkdir -p artifacts "$RUNNER_TEMP/BlankProject/Assets"
          trap '"$UNITY_EDITOR" -batchmode -nographics -quit -returnlicense \
            -logFile /dev/stdout \
            -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
            -projectPath "$RUNNER_TEMP/BlankProject" >/dev/null 2>&1 || true' EXIT

          LICENSE_VALUE=$(printf "%s" "$UNITY_LICENSE" | tr "\n" " " | sed -n 's/.*<DeveloperData Value="\([^"]*\)"\/>.*/\1/p')
          test -n "$LICENSE_VALUE"
          printf "%s" "$LICENSE_VALUE" | base64 -d > "$RUNNER_TEMP/developer-data.bin"
          SERIAL=$(tail -c +5 "$RUNNER_TEMP/developer-data.bin" | tr -d "\r\n")
          test "${#SERIAL}" -eq 27

          ACTIVATED=false
          ATTEMPT=1
          while [ "$ATTEMPT" -le 3 ]; do
            if "$UNITY_EDITOR" -batchmode -nographics -quit \
              -logFile artifacts/unity-activate.log \
              -serial "$SERIAL" \
              -username "$UNITY_EMAIL" \
              -password "$UNITY_PASSWORD" \
              -projectPath "$RUNNER_TEMP/BlankProject"; then
              ACTIVATED=true
              break
            fi
            echo "Serial activation attempt $ATTEMPT failed"
            ATTEMPT=$((ATTEMPT + 1))
            sleep $((ATTEMPT * 5))
          done

          if [ "$ACTIVATED" != true ]; then
            echo "Serial activation failed; falling back to email/password"
            "$UNITY_EDITOR" -batchmode -nographics -quit \
              -logFile artifacts/unity-activate-fallback.log \
              -username "$UNITY_EMAIL" \
              -password "$UNITY_PASSWORD" \
              -projectPath "$RUNNER_TEMP/BlankProject"
          fi

          # Why -debugCodeOptimization: Linux batchmode starts in Release.
          # Pause-point HotReload tests reject Release, and tiny patched
          # getters get JIT-inlined so they would not observe the edit.
          "$UNITY_EDITOR" -batchmode -nographics -debugCodeOptimization \
            -projectPath "$GITHUB_WORKSPACE" \
            -accept-apiupdate \
            -runTests \
            -testPlatform EditMode \
            -testFilter "$HOT_RELOAD_TEST_FILTER" \
            -testResults artifacts/editmode-latest-6000-7.xml \
            -logFile artifacts/unity-editmode-latest-6000-7.log

      - name: Upload latest 6000.7 test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && env.HAS_UNITY_LICENSE == 'true'
        with:
          name: Unity test results (latest 6000.7)
          path: artifacts
