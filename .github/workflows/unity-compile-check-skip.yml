# "Compile Check (Linux)" is a required status check, but the real workflow
# (unity-compile-check-and-test-runner.yml) only runs when C# sources change.
# Without this twin, PRs that do not touch C# would wait forever on the
# required check. This no-op twin uses the inverse paths-ignore filter so the
# check name is always reported, as recommended by GitHub:
# https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/defining-the-mergeability-of-pull-requests/troubleshooting-required-status-checks#handling-skipped-but-required-checks
name: Unity Compile Check

on:
  pull_request:
    branches: [ main, v3-beta ]
    paths-ignore:
      - 'Packages/src/Editor/**/*.cs'
      - 'Packages/src/Runtime/**/*.cs'
      - 'Assets/**/*.cs'
      - 'tests/**/*.cs'
      - 'tests/**/*.csproj'
      - '.github/workflows/unity-compile-check-and-test-runner.yml'

permissions:
  contents: read

jobs:
  compile-check:
    name: Compile Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Report success for PRs without C# changes
        run: echo "No C# changes, compile check not required."
